apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dependency-track-syft-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwetmore/dependency-track-syft-gitops.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
